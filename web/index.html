<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云学通 BI 差分 Agent</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --line:#e6e8f0; --line-2:#eef0f6;
    --ink:#111827; --ink-2:#5b6478; --ink-3:#8b93a7;
    --indigo:#4f46e5; --indigo-soft:#eef0ff; --orange:#f97316;
    --up:#dc2626; --down:#16a34a;      /* 中国股市习惯：涨红跌绿 */
    --warn:#b45309; --warn-bg:#fff7ed; --err:#b91c1c; --err-bg:#fef2f2;
    --ok:#047857; --ok-bg:#ecfdf5;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}

  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--indigo),#7c6cf3);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px}
  h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:16px 18px}

  .askrow{display:flex;gap:10px;margin-top:12px}
  textarea{flex:1;resize:vertical;min-height:52px;padding:11px 13px;font:inherit;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;background:#fcfcfe;outline:none;transition:border .15s,box-shadow .15s}
  textarea:focus{border-color:#c7c3ff;box-shadow:0 0 0 3px rgba(79,70,229,.10);background:#fff}
  button{cursor:pointer;font:inherit;font-weight:600;border:none;border-radius:10px;padding:0 20px;
    background:var(--indigo);color:#fff;transition:filter .15s,opacity .15s}
  button:hover:not(:disabled){filter:brightness(1.07)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .chip{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);cursor:pointer}
  .chip:hover{border-color:#c7c3ff;color:var(--indigo);background:var(--indigo-soft)}

  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    margin:26px 0 11px;font-weight:650;display:flex;align-items:center;gap:8px}
  h2::after{content:"";flex:1;height:1px;background:var(--line-2)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 14px}
  .kpi .name{font-size:12.5px;color:var(--ink-2)}
  .kpi .val{font-size:22px;font-weight:680;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
  .kpi .val small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px}
  .kpi .delta{font-size:12.5px;margin-top:5px;font-variant-numeric:tabular-nums}
  .d-up{color:var(--up)} .d-down{color:var(--down)} .d-flat{color:var(--ink-3)}
  .kpi .attr{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--ink-2)}
  .attr .row{display:flex;justify-content:space-between;gap:8px}
  .pill{font-size:10.5px;padding:1.5px 7px;border-radius:999px;font-weight:600}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}

  .answer{word-break:break-word;font-size:13.5px;line-height:1.85}
  .answer .sec{font-weight:650;color:var(--indigo)}
  .answer p{margin:0 0 10px}
  .answer p:last-child{margin-bottom:0}
  .answer h1,.answer h2,.answer h3,.answer h4{color:var(--ink);letter-spacing:0;text-transform:none;
    display:block;line-height:1.4;margin:17px 0 8px}
  .answer h1{font-size:20px}.answer h2{font-size:18px}.answer h3{font-size:16px}.answer h4{font-size:14px}
  .answer h1::after,.answer h2::after,.answer h3::after,.answer h4::after{display:none}
  .answer ul,.answer ol{margin:4px 0 12px;padding-left:24px}
  .answer li{padding-left:2px}
  .answer blockquote{margin:10px 0;padding:7px 13px;border-left:3px solid #c7c3ff;
    background:#f8f8ff;color:var(--ink-2)}
  .answer blockquote p{margin:0}
  .answer code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.9em;
    background:#f1f2f8;padding:2px 5px;border-radius:4px;color:#4338ca}
  .answer pre{overflow:auto;padding:12px 14px;background:#f7f8fc;border:1px solid var(--line-2);
    border-radius:8px;line-height:1.6}
  .answer pre code{padding:0;background:none;color:inherit}
  .answer table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:12.5px}
  .answer th,.answer td{border:1px solid var(--line);padding:6px 9px;text-align:left}
  .answer th{background:#f7f8fc;font-weight:650}
  .answer a{color:var(--indigo);text-decoration:underline}

  .steps{display:flex;flex-direction:column;gap:9px}
  .step{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .step .hd{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;cursor:pointer}
  .step .hd:hover{background:#fafbfe}
  .num{flex:0 0 22px;height:22px;border-radius:6px;background:var(--indigo-soft);color:#4338ca;
    display:grid;place-items:center;font-size:11.5px;font-weight:700;margin-top:1px}
  .step .body{flex:1;min-width:0}
  .tool{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px;font-weight:650;color:var(--ink)}
  .step .params{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink-3);
    word-break:break-all;margin-top:2px}
  .why{font-size:12.5px;color:var(--ink-3);margin-top:4px}
  .got{font-size:13px;color:var(--ink);margin-top:5px;padding-left:10px;border-left:2px solid var(--indigo-soft)}
  .step pre{display:none;margin:0;padding:12px 14px;background:#fbfbfe;border-top:1px solid var(--line-2);
    font-size:11.5px;line-height:1.6;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .step.open pre{display:block}
  .ms{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap;padding-left:8px}

  .goal{background:linear-gradient(180deg,var(--indigo-soft),#f8f9ff);border:1px solid #dcd9ff;
    border-left:3px solid var(--indigo);border-radius:10px;padding:10px 14px;margin-bottom:11px;
    font-size:13px}
  .goal .name{font-weight:650;color:#3730a3}
  .goal .meta{color:var(--ink-3);font-size:11.5px;margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
  .goal .meta .pill{background:#fff;border:1px solid #dcd9ff;color:#4338ca}
  .goal .note{color:var(--ink-2);margin-top:5px;font-size:12.5px;line-height:1.6}

  .evi{display:grid;gap:10px}
  .evi .item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--orange);
    border-radius:10px;padding:12px 14px;font-size:13px}
  .evi .who{font-weight:650}
  .evi .trace{font-size:12.5px;color:var(--ink-2);margin-top:7px;line-height:1.75}
  .evi code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:#f4f5fa;
    padding:1px 5px;border-radius:4px;color:#4338ca;word-break:break-all}

  .empty{color:var(--ink-3);font-size:13px;padding:26px 0;text-align:center}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.45);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  .spin.loading{width:22px;height:22px;border-color:#dcd9ff;border-top-color:var(--indigo);
    margin:0;vertical-align:middle}
  .loading-state{display:flex;justify-content:center;align-items:center;gap:10px;min-height:90px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:1.8s}}
  .banner{border-radius:10px;padding:11px 14px;font-size:13px;margin-top:14px;display:none}
  .banner.show{display:block}
  .banner.err{background:var(--err-bg);color:var(--err);border:1px solid #fecaca}
  footer{margin-top:34px;color:var(--ink-3);font-size:12px;text-align:center}
  footer a{color:var(--indigo);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="logo">BI</div>
      <div>
        <h1>云学通 BI 差分 Agent</h1>
        <div class="sub">Excel 差分 · 事实存储 · 固定查询 API · MCP · 自然语言闭环</div>
      </div>
    </div>
  </header>

  <div class="card pad">
    <div style="font-weight:650;font-size:14px">问一个问题</div>
    <div class="sub" style="margin-top:3px">系统会自动多轮查询、发现异常、追溯证据，再给出解释。</div>
    <div class="askrow">
      <textarea id="q" placeholder="例如：为什么报名人数涨了？本期有哪些异常？证据在哪？"></textarea>
      <button id="go">提问</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="banner err" id="err"></div>
  </div>

  <div id="result" style="display:none">
    <h2>核心指标</h2>
    <div class="kpis" id="kpis"></div>

    <h2>结论与解释</h2>
    <div class="card pad"><div class="answer" id="answer"></div></div>

    <div id="evi-wrap" style="display:none">
      <h2>证据追溯</h2>
      <div class="evi" id="evi"></div>
    </div>

    <h2>执行轨迹 <span id="stepcount" style="text-transform:none;letter-spacing:0;font-weight:500"></span></h2>
    <div class="steps" id="steps"></div>
  </div>

  <div id="placeholder" class="empty" aria-live="polite">输入问题后，这里会显示可核查的推导过程。</div>

  <footer>
    <a href="/">首页</a> · <a href="/dashboard">业务驾驶舱</a> · <a href="/docs" target="_blank">API 文档</a> · <a href="/health" target="_blank">健康检查</a>
    · 所有结论均可追溯到原始 Excel 的具体行
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, d = 0) => v === null || v === undefined ? "—"
  : Number(v).toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d });

function renderMarkdown(source) {
  const inline = (value) => {
    const tokens = [];
    const hold = (html) => {
      const key = `\u0000${tokens.length}\u0000`;
      tokens.push(html);
      return key;
    };
    let text = String(value ?? "");

    text = text.replace(/`([^`\n]+)`/g, (_, code) => hold(`<code>${esc(code)}</code>`));
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,
      (_, label, href, title) => {
        const safeHref = /^(https?:\/\/|mailto:)/i.test(href) || /^(\/|\.\/|\.\.\/|#)/.test(href);
        if (!safeHref) return label;
        const titleAttr = title ? ` title="${esc(title)}"` : "";
        return hold(`<a href="${esc(href)}"${titleAttr} target="_blank" rel="noopener noreferrer">${esc(label)}</a>`);
      });

    let html = esc(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/__(.+?)__/g, "<strong>$1</strong>")
      .replace(/~~(.+?)~~/g, "<del>$1</del>")
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
      .replace(/(^|[^_])_([^_\n]+)_(?!_)/g, "$1<em>$2</em>")
      .replace(/【([^】]+)】/g, '<span class="sec">【$1】</span>');
    html = html.replace(/\u0000(\d+)\u0000/g, (_, index) => tokens[Number(index)]);
    return html;
  };

  const lines = String(source ?? "").replace(/\r\n?/g, "\n").split("\n");
  const output = [];
  let paragraph = [];
  let listType = null;
  let listItems = [];

  const flushParagraph = () => {
    if (paragraph.length) {
      output.push(`<p>${paragraph.map(inline).join("<br>")}</p>`);
      paragraph = [];
    }
  };
  const flushList = () => {
    if (listType) {
      output.push(`<${listType}>${listItems.map((item) => `<li>${inline(item)}</li>`).join("")}</${listType}>`);
      listType = null;
      listItems = [];
    }
  };
  const isTableDelimiter = (line) => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
  const tableCells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());

  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flushParagraph();
      flushList();
      const codeLines = [];
      i += 1;
      while (i < lines.length && !/^\s*```/.test(lines[i])) codeLines.push(lines[i++]);
      if (i < lines.length) i += 1;
      output.push(`<pre><code>${esc(codeLines.join("\n"))}</code></pre>`);
      continue;
    }
    const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
    if (heading) {
      flushParagraph();
      flushList();
      const level = heading[1].length;
      output.push(`<h${level}>${inline(heading[2])}</h${level}>`);
      i += 1;
      continue;
    }
    if (i + 1 < lines.length && line.includes("|") && isTableDelimiter(lines[i + 1])) {
      flushParagraph();
      flushList();
      const headers = tableCells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(tableCells(lines[i++]));
      output.push(`<table><thead><tr>${headers.map((cell) => `<th>${inline(cell)}</th>`).join("")}</tr></thead><tbody>${
        rows.map((row) => `<tr>${headers.map((_, index) => `<td>${inline(row[index] || "")}</td>`).join("")}</tr>`).join("")
      }</tbody></table>`);
      continue;
    }
    const listMatch = line.match(/^\s*(?:([-*+])|(\d+)\.)\s+(.+)$/);
    if (listMatch) {
      flushParagraph();
      const nextType = listMatch[2] ? "ol" : "ul";
      if (listType && listType !== nextType) flushList();
      listType = nextType;
      listItems.push(listMatch[3]);
      i += 1;
      continue;
    }
    if (/^\s*>\s?/.test(line)) {
      flushParagraph();
      flushList();
      const quoteLines = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) quoteLines.push(lines[i++].replace(/^\s*>\s?/, ""));
      output.push(`<blockquote><p>${quoteLines.map(inline).join("<br>")}</p></blockquote>`);
      continue;
    }
    if (/^\s*([-*_]\s*){3,}$/.test(line)) {
      flushParagraph();
      flushList();
      output.push("<hr>");
      i += 1;
      continue;
    }
    if (!line.trim()) {
      flushParagraph();
      flushList();
      i += 1;
      continue;
    }
    flushList();
    paragraph.push(line);
    i += 1;
  }
  flushParagraph();
  flushList();
  return output.join("");
}

const EXAMPLES = [
  "为什么报名人数涨了？",
  "本期有哪些异常？把证据找出来",
  "对比两期，变化最大的是什么",
  "已通过人数为什么增加",
  "数据质量有没有问题",
];
$("chips").innerHTML = EXAMPLES.map((q) => `<span class="chip">${esc(q)}</span>`).join("");
$("chips").addEventListener("click", (e) => {
  if (e.target.classList.contains("chip")) { $("q").value = e.target.textContent; ask(); }
});

async function ask() {
  const question = $("q").value.trim();
  if (!question) { $("q").focus(); return; }
  const btn = $("go");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>查询中';
  $("err").classList.remove("show");
  $("kpis").innerHTML = "";
  $("answer").innerHTML = "";
  $("evi").innerHTML = "";
  $("evi-wrap").style.display = "none";
  $("steps").innerHTML = "";
  $("stepcount").textContent = "";
  $("result").style.display = "none";
  $("placeholder").classList.remove("empty");
  $("placeholder").innerHTML = '<div class="loading-state"><span class="spin loading" aria-hidden="true"></span><span>正在查询，请稍候…</span></div>';
  $("placeholder").style.display = "block";

  try {
    const res = await fetch("/agent/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0, 200));
    render(await res.json());
  } catch (e) {
    $("err").textContent = "查询失败：" + e.message;
    $("err").classList.add("show");
    $("placeholder").textContent = "查询未完成，请检查错误提示后重试。";
    $("placeholder").classList.add("empty");
  } finally {
    btn.disabled = false; btn.textContent = "提问";
  }
}

function render(d) {
  $("placeholder").style.display = "none";
  $("result").style.display = "block";

  // ---- 指标卡 ----
  $("kpis").innerHTML = (d.metrics || []).map((m) => {
    const dv = m.delta;
    const cls = dv > 0 ? "d-up" : dv < 0 ? "d-down" : "d-flat";
    const arrow = dv > 0 ? "↑" : dv < 0 ? "↓" : "＝";
    const dec = m.decimals || 0;
    const attr = m.attribution || {};
    const drivers = (attr.drivers || []).filter((x) => x.effect);
    const attrHtml = drivers.length ? `
      <div class="attr">
        ${drivers.map((x) => `<div class="row"><span>${esc(x.label)}</span>
          <b class="${x.effect > 0 ? "d-up" : "d-down"}">${x.effect > 0 ? "+" : ""}${num(x.effect)}</b></div>`).join("")}
        ${attr.residual !== null && attr.residual !== undefined
          ? `<div class="row" style="margin-top:4px">
               <span class="pill ${attr.residual === 0 ? "ok" : "warn"}">${attr.residual === 0 ? "已完全解释" : "残差 " + num(attr.residual, 2)}</span></div>`
          : ""}
      </div>` : "";
    return `<div class="kpi">
      <div class="name">${esc(m.metric_name)}</div>
      <div class="val">${num(m.value_to, dec)}<small>${esc(m.unit || "")}</small></div>
      <div class="delta ${cls}">${arrow} ${num(Math.abs(dv ?? 0), dec)}${esc(m.unit || "")}
        ${m.delta_pct !== null && m.delta_pct !== undefined ? `（${m.delta_pct > 0 ? "+" : ""}${num(m.delta_pct, 1)}%）` : ""}</div>
      ${attrHtml}
    </div>`;
  }).join("") || '<div class="empty">无指标数据</div>';

  // ---- 解释 ----
  const goal = d.goal;
  let goalHtml = "";
  if (goal) {
    const meta = [];
    if (goal.priority) meta.push(`<span class="pill">优先级: ${esc(goal.priority)}</span>`);
    if (goal.focus) meta.push(`<span class="pill">策略: ${esc(goal.focus)}</span>`);
    if (goal.action) meta.push(`<span class="pill">action: ${esc(goal.action)}</span>`);
    let note = "";
    const m = (d.answer || "").match(/说明：([^【]*)/);
    if (m) note = m[1].trim().split("\n")[0];
    goalHtml = `<div class="goal"><div class="name">🎯 命中目标：${esc(goal.name)}</div>
      ${goal.describe ? `<div class="note" style="margin-top:3px">${esc(goal.describe)}</div>` : ""}
      ${note ? `<div class="note">${esc(note)}</div>` : ""}
      <div class="meta">${meta.join("")}</div></div>`;
  }
  $("answer").innerHTML = goalHtml + renderMarkdown(d.answer || "");

  // ---- 证据 ----
  const evi = d.evidence || [];
  $("evi-wrap").style.display = evi.length ? "block" : "none";
  $("evi").innerHTML = evi.map((e) => {
    const ev = e.event || {}, tr = e.trace || {}, chain = tr.chain || [];
    return `<div class="item">
      <div class="who">${esc(ev.name || ev.record_key || "?")}
        <span style="font-weight:400;color:var(--ink-3)">｜${esc(e.anomaly?.rule_id || "")}</span></div>
      <div class="trace">
        变更：<code>${esc(ev.field_name || "")}</code>
        ${esc(ev.value_from_raw || "(空)")} → ${esc(ev.value_to_raw || "(空)")}<br>
        ${chain.filter((c) => c.present).map((c) =>
          `来源（${esc(c.batch)}）：<code>${esc(c.path || c.file)}</code> 第 <b>${c.source_row}</b> 行
           ｜证件号 <code>${esc(c.id_number_masked || "")}</code>`).join("<br>")}
        ${chain[0]?.file_sha256 ? `<br>文件指纹 sha256：<code>${esc(chain[0].file_sha256.slice(0, 24))}…</code>` : ""}
      </div></div>`;
  }).join("");

  // ---- 轨迹 ----
  $("stepcount").textContent = `共 ${d.step_count} 步 · ${d.elapsed_ms} ms · 批次 ${d.from} → ${d.to}`;
  $("steps").innerHTML = (d.steps || []).map((s) => `
    <div class="step">
      <div class="hd">
        <div class="num">${s.n}</div>
        <div class="body">
          <div class="tool">${esc(s.tool)}</div>
          <div class="params">${esc(JSON.stringify(s.params))}</div>
          <div class="why">↳ ${esc(s.reason)}</div>
          <div class="got">${esc(s.summary)}</div>
        </div>
        <div class="ms">${s.elapsed_ms}ms</div>
      </div>
      <pre>${esc(JSON.stringify(s.result, null, 2))}</pre>
    </div>`).join("");
  document.querySelectorAll(".step .hd").forEach((hd) =>
    hd.addEventListener("click", () => hd.parentElement.classList.toggle("open")));

  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("go").addEventListener("click", ask);
$("q").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") ask();
});
</script>
</body>
</html>
