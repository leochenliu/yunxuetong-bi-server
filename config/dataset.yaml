# ============================================================================
# 数据集契约：一份 Excel 如何被读进来、如何对齐、如何比差异、什么算异常。
# 本文件是「第一阶段：Excel 差分原型」的规则唯一出处。
# 修改规则只需改这里，引擎代码不用动。
# ============================================================================

dataset:
  id: denggao
  name: 登高培训总表
  sheet: 总表

# ---------------------------------------------------------------------------
# 主键：跨期对齐的唯一标识
# ---------------------------------------------------------------------------
identity:
  # 复合主键。不用裸证件号 —— 实测表中存在两个不同的人共用同一身份证号
  # （吴明志 / 吴民志 同为 340221197212154953），裸证件号做 key 会静默覆盖掉其中一人。
  columns: [证件号码, 姓名]
  separator: "|"
  # 口径：无证件号码的行不参与任何统计（原型约定，约占 2.4%），
  # 剔除数量会写入版本元数据，保证「分母变小」这件事永远有痕迹。
  require_identity: true

# ---------------------------------------------------------------------------
# 字段映射：Excel 列名 -> 标准字段名（snake_case）
# 保留中文列名作为「物理列」，映射后同时暴露标准名，供 API / MCP / Agent 使用。
# ---------------------------------------------------------------------------
field_mapping:
  姓名: name
  取证类型: cert_type
  开班编号: class_code
  证件号码: id_number
  联系电话: phone
  工作单位: employer
  对接联系人: contact_person
  科目: subject
  考核号: exam_no
  考试状态: exam_status
  培训情况: training_status
  是否延期: is_deferred
  培训班编号: training_class_code
  备注1: remark1
  备注2: remark2
  考试点: exam_site
  考试日期: exam_date
  分数: score
  补考次数: retry_count
  培训第一天日期: train_day1_date
  培训第一天签到情况: train_day1_attendance
  培训第二天日期: train_day2_date
  培训第二日签到情况: train_day2_attendance
  模拟日期: mock_date
  负责老师: teacher
  是否可结算（现代）: settleable
  是否付款: payment_status
  是否开票: invoice_status
  金额: amount
  付款凭证: payment_proof

# ---------------------------------------------------------------------------
# 差分字段
# ---------------------------------------------------------------------------
# 参与逐字段比对的「状态字段」：这些字段变化会生成 changed 事件。
# 刻意不含姓名 / 电话 / 单位等易波动文本列 —— 它们既不反映业务状态，
# 又会因「同一人表述不一致」制造假变更，同时扩大个人信息留存面。
tracked_fields:
  - 开班编号
  - 考试状态
  - 考试日期
  - 分数
  - 是否付款
  - 备注1

# 辅助字段：只统计变动数量、不做严重度分级（用于「本期共 N 处辅助信息变动」这类汇总）
aux_tracked_fields:
  - 补考次数
  - 是否开票
  - 金额

# 变更严重度：决定异常检测与告警级别
severity:
  开班编号: high
  考试状态: medium
  考试日期: low
  分数: high
  是否付款: medium
  备注1: info
  补考次数: low
  是否开票: low
  金额: medium

# ---------------------------------------------------------------------------
# 派生列
# ---------------------------------------------------------------------------
derive:
  # 「报名日期」不在原表里。报名 / 编班时间编码在「开班编号」中：
  #   0706782 + 年份位(5=2025, 6=2026) + MMDD(4) + 班序号(1)   共 13 位
  #   例 0706782605115 -> 2026-05-11 第 5 班
  #   例 0706782509141 -> 2025-09-14 第 1 班
  # 该解读经一致性校验：报名月份从未晚于考试月份（违例 0 条）。
  class_code:
    column: 开班编号
    prefix: "0706782"
    length: 13
    year_pos: 7
    year_map:
      5: 2025
      6: 2026
    mmdd_pos: 8
    seq_pos: 12
  outputs:
    - 报名日期
    - 报名月份
    - 开班日期
    - 班序号
    - 人数
    - 已考试人数
    - 未考试人数
    - 已通过人数
    - 考试月份
    - 已付款人数
    - 延期换证人数

# ---------------------------------------------------------------------------
# 差分规则：值如何归一化后再比较
# ---------------------------------------------------------------------------
diff_rules:
  normalization:
    strip_whitespace: true
    # 这些「空占位」在比较时一律视作空串
    empty_tokens: ["", "-", "/", "N/A", "null", "None", "nan", "NaN"]
    case_sensitive: false
    # 日期统一成 YYYY-MM-DD 再比（避免 Excel Date 序列号 / ISO 串互比产生假差异）
    date_format: "%Y-%m-%d"
    # 数值规范化：80 / "80" / "80.0" 视为同一值
    numeric_canonical: true
  classify:
    added: 本期有、上期无（新录入 / 新报名）
    removed: 上期有、本期无（退费 / 剔除 / 漏报）
    changed: 复合主键相同但追踪字段值不同（逐字段记录 from -> to）
    unchanged: 两期所有追踪字段完全一致

# ---------------------------------------------------------------------------
# 异常规则：数据质量 + 业务异常
# ---------------------------------------------------------------------------
anomaly_rules:
  - id: duplicate_record_key
    desc: 同一复合主键出现多行（同证件号同名 = 重复录入）
    severity: high
  - id: missing_identity
    desc: 有数据行但无证件号码
    severity: medium
  - id: invalid_id_number
    desc: 证件号码非 18 位，或校验位不合法
    severity: high
  - id: id_number_length_invalid
    desc: 证件号码位数不是 18 位（源表录入错误）
    severity: high
  - id: score_out_of_range
    desc: 分数不在 [0, 100] 区间
    severity: high
  - id: passed_but_no_exam_date
    desc: 考试状态 = 已通过，但没有考试日期
    severity: high
  - id: passed_but_low_score
    desc: 考试状态 = 已通过，但分数 < 60
    severity: high
  - id: passed_but_no_score
    desc: 考试状态 = 已通过，但没有分数（未出分或漏录）
    severity: medium
  - id: paid_but_zero_amount
    desc: 是否付款 = 已付款，但金额为空或 0
    severity: medium
  - id: class_code_unparsable
    desc: 开班编号存在但无法解析出报名日期
    severity: medium
  # 跨期规则（由 check_cross_period_anomalies 在两期比对时产出）。
  # 必须在这里声明，否则页面上会退化显示英文 rule_id。
  - id: exam_status_regressed
    desc: 考试状态从「已通过」回退为其他状态
    severity: high
