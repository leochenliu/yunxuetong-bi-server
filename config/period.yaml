# ============================================================================
# 自然时间周期（全局配置项，单位：天）
# ----------------------------------------------------------------------------
# 系统里所有「按自然时间统计」的口径都取自这里，**单位统一为「天」**：
#   days: 7  -> 一周
#   days: 30 -> 一个自然月
#
# 切法：从 anchor 起每 days 天切一刀（固定长度窗口，不是日历月）：
#   [anchor, anchor+days) 为第 0 期，[anchor+days, anchor+2*days) 为第 1 期……
#   - anchor 设为某个周一即可对齐自然周（例：2026-01-05）；
#   - days=30 时窗口相对日历月会有漂移（日历月 28~31 天），这是「以天为单位」的口径；
#   - 周期标签取窗口**起始日**，窗口结束日随数据一起下发，便于核对。
#
# 改口径只改本文件，不动代码；统计在查询时计算，改完刷新页面即可生效。
# 注意：源数据本身的时间粒度决定了下限——登高表能解析到「日」（报名日期），
#       课程月份汇总表只有「年+月」，无法按天切分（见 config/datasets/）。
# ============================================================================
period:
  unit: day              # 单位：仅支持 day（天）
  days: 30               # 周期长度（天）：7 = 一周，30 = 一个自然月
  anchor: "2025-01-01"   # 窗口对齐锚点（周一 / 月首均可自行设定）
  label: ""              # 展示名；留空按 days 自动推断（7→周，30→月）
