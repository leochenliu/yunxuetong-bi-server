# ============================================================================
# 证书台账（小黄卡）—— 新的统计类目
# ----------------------------------------------------------------------------
# 数据来源：data/inbound/certificates/小黄卡简表_姓名_身份证_公司_证书编号_开始日期_有效期_20261026.xlsx
#   工作表：小黄卡清单
#   列：姓名 / 身份证号码 / 公司名称 / 证书编号 / 证书开始日期 / 证书有效期 / 日期来源
#
# 核心口径：**过期日期**。原始「证书有效期」列有三种写法，解析规则见 src/bi/expiry.py：
#   "2026/10/01"              单日期 —— 就是过期日期
#   "2024/10/01-2026/10/01"   区间   —— 右端是过期日期
#   "2027年1月"                只有年月 —— 取该月最后一天，精度降级为「月」
# 「日期来源」列会标明这个日期是**证面原文**（证面真实到期日）还是**按 2 年效期推算**（推算值），
# 两者必须分开看：推算值能回答规模，续证提醒必须回证面核对。
# ============================================================================

dataset:
  id: certificates
  name: 证书台账（小黄卡）
  sheet: 小黄卡清单

# ---------------------------------------------------------------------------
# 主键：身份证号码 + 姓名 + 证书编号
# ---------------------------------------------------------------------------
# 为什么必须带证书编号：**一人多证**。实测 9085 行里只有 8634 个不同身份证号，
# 424 人持有多张证（多出 451 张，不同发证年份 / 不同工种）。只用「身份证号码|姓名」会把多证
# 静默覆盖成一行——正是本项目复合主键约定要防的那类静默丢人。
# 证书编号本身也唯一（9085 行 9085 个编号），带上它才是一张证一个身份。
identity:
  columns: [身份证号码, 姓名, 证书编号]
  separator: "|"
  # 口径：没有身份证号的行不参与统计（实测仅 1 行为护照号 P800610BI，仍保留但会被
  # invalid_id_number 规则标出来）。剔除数量写进版本元数据。
  require_identity: true
  id_column: 身份证号码
  name_column: 姓名

# 个人信息列：事实层存**归一化后的明文**（精确去重与跨源关联用），
# 输出面（API / 看板 / MCP / 证据链 / payload）一律掩码，见 AGENTS.md 约定 10
pii_columns: [身份证号码]

# ---------------------------------------------------------------------------
# 字段清洗：配置驱动（引擎见 src/bi/cleaning.py）
# ---------------------------------------------------------------------------
# 只做「有唯一正确答案」的清洗：全角转半角、去首尾空白、去噪字符、末位 x→X。
# 绝不做：补身份证缺失位、改校验位、给非法日期（4 月 31 日）找替代值——
# 那三类是编造，只由异常规则报出来给人工核对。
cleaning:
  - column: 身份证号码
    trim: true
    full_to_half: true
    # 尾部噪字符：中文引号 / 英文引号 / 句点 / 全角空格（实测命中 2 条）
    remove_chars: "‘’'’。.　"
    uppercase_x: true          # 末位小写 x → X

  - column: 姓名
    trim: true
    full_to_half: true
    collapse_whitespace: true

  - column: 公司名称
    trim: true
    full_to_half: true
    collapse_whitespace: true

  - column: 证书编号
    trim: true
    full_to_half: true
    uppercase: true

# ---------------------------------------------------------------------------
# 字段映射：Excel 列名 -> 标准字段名
# ---------------------------------------------------------------------------
field_mapping:
  姓名: name
  身份证号码: id_number
  公司名称: company
  证书编号: cert_no
  证书开始日期: start_date
  证书有效期: validity_raw
  日期来源: date_source
  开始日期: start_date_iso
  过期日期: expiry_date
  过期日期精度: expiry_precision
  有效期天数: validity_days
  过期月份: expiry_month

# ---------------------------------------------------------------------------
# 差分追踪字段：跨期快照比对这些列
# ---------------------------------------------------------------------------
# 追踪**派生后的规范列**（开始日期 / 过期日期，都是 YYYY-MM-DD），而不是原始文本列
# 「证书有效期」——原始列写法差异大（区间 / 斜杠 / 中文），直接比会产出假变更。
tracked_fields: [公司名称, 开始日期, 过期日期, 日期来源]
aux_tracked_fields: []

# ---------------------------------------------------------------------------
# 派生规则：过期日期
# ---------------------------------------------------------------------------
derive:
  expiry:
    column: 证书有效期          # 原始列（可能是单日期 / 区间 / 只有年月）
    start_column: 证书开始日期
    source_column: 日期来源
    estimated_source_values: ["按2年效期推算"]   # 这些来源的过期日期是推算值，不是证面原文
    outputs:
      - 开始日期          # 规范化后的开始日期（YYYY-MM-DD）
      - 过期日期          # 核心指标（YYYY-MM-DD）；解析不出就留空，不拿别的顶替
      - 过期日期精度      # 日 / 月（"月" 表示按月末取值，是估计值）
      - 有效期天数        # 过期日期 - 开始日期
      - 过期月份          # YYYY-MM，用于按月 / 按周期聚合
      - 有效期形态        # 单日期 / 区间 / 年月 / 无法解析（数据质量口径）

# ---------------------------------------------------------------------------
# 异常规则
# ---------------------------------------------------------------------------
anomaly_rules:
  - id: expiry_unresolved
    desc: 过期日期无法解析（核心指标缺失，续证提醒无法覆盖到这条）
    severity: high
  - id: expiry_before_start
    desc: 过期日期早于开始日期（日期倒挂）
    severity: high
  - id: expiry_month_precision
    desc: 过期日期只有年月精度，按月末取值（估计值）
    severity: low
  - id: expiry_estimated_source
    desc: 过期日期来自「按2年效期推算」，非证面原文
    severity: info
  - id: id_number_length_invalid
    desc: 证件号位数不是 18 位（源表录入错误，需人工核对）
    severity: high
  - id: invalid_id_number
    desc: 证件号校验位不合法（源表录入错误，需人工核对）
    severity: high
